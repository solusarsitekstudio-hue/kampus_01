name: Deploy Static Showcase to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Start Background SIAK-KAPRODI Server
        run: |
          python server.py &
          # Tunggu server aktif di port 40404
          for i in {1..15}; do
            if curl -s http://127.0.0.1:40404/api/health > /dev/null; then
              echo "Server aktif di port 40404!"
              break
            fi
            echo "Menunggu server siap ($i/15)..."
            sleep 1
          done

      - name: Compile Static Showcase (Freeze 19 Endpoints)
        run: |
          python scripts/export_static_showcase.py

      - name: Verify Static Showcase Artifact
        run: |
          python tests/test_static_exporter.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist_gh_pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
